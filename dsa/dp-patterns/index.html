<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DP Patterns & Recursion</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="A comprehensive guide to Dynamic Programming patterns and Recursion.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
        title="docsify-darklight-theme" type="text/css">
</head>

<body>
    <div id="app"></div>
    <script>
        window.$docsify = {
            name: 'DP Patterns',
            repo: '',
            loadSidebar: true,
            loadNavbar: true,
            subMaxLevel: 3,
            auto2top: true,
            homepage: 'README.md',
            mermaidConfig: {
                querySelector: ".mermaid"
            },
            darklightTheme: {
                siteFont: "Source Sans Pro,Helvetica Neue,Arial,sans-serif",
                defaultTheme: 'dark',
                codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
                bodyFontSize: '15px',
                dark: {
                    accent: '#42b983',
                    toggleBackground: '#ffffff',
                    background: '#091a28',
                    textColor: '#b0b1b1',
                    codeHighlightColor: '#42b983',
                    codeBackgroundColor: '#0e2233',
                    borderColor: '#0d2538',
                    blockQuoteColor: '#42b983',
                    highlightColor: '#42b983',
                    sidebarSublink: '#b0b1b1',
                    codeTypeColor: '#ffffff',
                    coverBackground: 'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)',
                    toggleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/sun.svg)'
                },
                light: {
                    accent: '#42b983',
                    toggleBackground: '#091a28',
                    background: '#ffffff',
                    textColor: '#34495e',
                    codeHighlightColor: '#42b983',
                    codeBackgroundColor: '#f8f8f8',
                    borderColor: 'rgba(0,0,0,.07)',
                    blockQuoteColor: '#42b983',
                    highlightColor: '#42b983',
                    sidebarSublink: '#505d6b',
                    codeTypeColor: '#091a28',
                    coverBackground: 'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)',
                    toggleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/moon.svg)'
                }
            }
        }
    </script>
    <!-- Docsify v4 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>

    <!-- Dark Mode Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"
        type="text/javascript"></script>

    <!-- Mermaid Plugin -->
    <script src="https://unpkg.com/mermaid/dist/mermaid.min.js"></script>
    <script src="https://unpkg.com/docsify-mermaid@latest/dist/docsify-mermaid.js"></script>
    <script>mermaid.initialize({ startOnLoad: true });</script>

    <!-- Search Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

    <!-- Copy to Clipboard Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>

</html>
